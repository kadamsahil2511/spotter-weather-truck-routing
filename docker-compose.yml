name: fs-truck

services:
  api:
    container_name: fs-truck-api
    image: fs-truck-api:${IMAGE_TAG:-latest}
    build: .
    env_file: ${ENV_FILE:-.env}
    stop_grace_period: 20s
    environment:
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-fsapi.kadamsahil.com,127.0.0.1,localhost}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    ports:
      - "127.0.0.1:8002:8000"
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [fs-truck]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\", timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    container_name: fs-truck-redis
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    restart: unless-stopped
    networks: [fs-truck]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  fs-truck:
